aid: testsigma
name: Testsigma
description: >-
  Testsigma is an agentic, GenAI-powered codeless test automation platform. AI
  co-workers work alongside QA teams to author and maintain automated tests in
  natural language across web, mobile, desktop, API, and packaged applications
  like Salesforce and SAP. Testsigma exposes a REST API
  (app.testsigma.com/api/v1, Bearer API-Key authentication) to manage projects,
  applications, environments, elements, uploads, and test plans, and to trigger
  and poll test-plan executions remotely from CI/CD pipelines. A Community
  Edition is open source under Apache 2.0. Testsigma is backed by Accel.
